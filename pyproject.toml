[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "specguard-ai"
version = "0.1.0"
description = "Доказательный анализ технических заданий для финтех-проектов"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.18",
  "google-genai>=1.20",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "jinja2>=3.1",
  "pdfplumber>=0.11",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "fpdf2>=2.7"]

[project.scripts]
specguard = "app.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.setuptools.package-data]
app = ["prompts/*.txt", "reports/*.html"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
